<div style="font-family:'Tekstvjór';max-width:1400px;margin:40px auto;padding:0 20px;background:#f5f5f5;color:#222;">
  <h1 style="margin-bottom:20px;"></h1>
  <p id="status" style="margin:20px 0;">Lade Daten …</p>
  <div style="overflow-x:auto;background:white;border-radius:8px;">
    <table id="jarar-table" hidden style="font-family:'Tekstvjór';width:100%;border-collapse:collapse;">
      <thead>
        <tr>
          <th style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;background:#eee;">Symbol</th>
          <th style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;background:#eee;">Unicode</th>
          <th style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;background:#eee;">Transkription Jämn</th>
          <th style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;background:#eee;">Transkription Latein</th>
          <th style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;background:#eee;">Übersetzung</th>
          <th style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;background:#eee;">Anmerkung</th>
        </tr>
      </thead>
  <tbody></tbody>
</table>
  </div>
  <script>
    async function ladeJarar() {
      const status = document.getElementById("status");
      const table = document.getElementById("jarar-table");
      const tbody = table.querySelector("tbody");
      try {
        const response = await fetch("/jarar.json");
        if (!response.ok) {
          throw new Error(`HTTP-Fehler ${response.status}`);
        }
        const daten = await response.json();
        for (const eintrag of daten) {
          const tr = document.createElement("tr");
          const unicodeHex =
            "U+" +
            eintrag.unicode
              .toString(16)
              .toUpperCase()
              .padStart(4, "0");
          tr.innerHTML = `
            <td style="font-family:'Tekstvjór';font-size:2rem;white-space:nowrap;padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;">${escapeHTML(eintrag.symbol)}</td>
            <td style="font-family:'Tekstvjór';white-space:nowrap;padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;">
              ${eintrag.unicode}<br>
              ${unicodeHex}
            </td>
            <td style="font-family:'Tekstvjór';padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;">${escapeHTML(eintrag.transkriptionjamn)}</td>
            <td style="font-family:'Tekstvjór';padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;">${escapeHTML(eintrag.transkriptionlatein)}</td>
            <td style="font-family:'Tekstvjór';padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;">${escapeHTML(eintrag.ubersetzung)}</td>
            <td style="font-family:'Tekstvjór';padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;">${escapeHTML(eintrag.anmerkung)}</td>
          `;
          tbody.appendChild(tr);
        }
        status.textContent = `${daten.length} Einträge`;
        table.hidden = false;
      } catch (error) {
        console.error(error);
        status.textContent = "Die Daten konnten nicht geladen werden.";
      }
    }
    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
    ladeJarar();
  </script>
</div>
