<div style="max-width:1400px;margin:40px auto;padding:0 20px;background:#f5f5f5;color:#222;">
  <h1 style="margin-bottom:20px;">
    <span style="font-family:'Tekstvjór'"></span>
  </h1>
  <p id="status" style="margin:20px 0;">
    <span style="font-family:'Tekstvjór'">Lade Daten …</span>
  </p>
  <div style="overflow-x:auto;background:white;border-radius:8px;">
    <table id="jarar-table" hidden style="width:100%;border-collapse:collapse;">
      <thead>
        <tr>
          <th style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;background:#eee;">
            <span style="font-family:'Tekstvjór'">Symbol</span>
          </th>
          <th style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;background:#eee;">
            <span style="font-family:'Tekstvjór'">Unicode</span>
          </th>
          <th style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;background:#eee;">
            <span style="font-family:'Tekstvjór'">Transkription Jämn</span>
          </th>
          <th style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;background:#eee;">
            <span style="font-family:'Tekstvjór'">Transkription Latein</span>
          </th>
          <th style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;background:#eee;">
            <span style="font-family:'Tekstvjór'">Übersetzung</span>
          </th>
          <th style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;background:#eee;">
            <span style="font-family:'Tekstvjór'">Anmerkung</span>
          </th>
        </tr>
      </thead>
  <tbody></tbody>
</table>
  </div>
  <script>
    async function ladeJarar() {
      const status = document.getElementById("status");
      const table = document.getElementById("jarar-table");
      const tbody = table.querySelector("tbody");
      try {
        const response = await fetch("/jarar.json");
        if (!response.ok) {
          throw new Error(`HTTP-Fehler ${response.status}`);
        }
        const daten = await response.json();
        for (const eintrag of daten) {
          const tr = document.createElement("tr");
          const unicodeHex =
            "U+" +
            eintrag.unicode
              .toString(16)
              .toUpperCase()
              .padStart(4, "0");
          tr.innerHTML = `
            <td style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;">
              <span style="font-family:'Tekstvjór';font-size:2rem;white-space:nowrap;">${escapeHTML(eintrag.symbol)}</span>
            </td>
            <td style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;">
              <span style="font-family:'Tekstvjór';white-space:nowrap;">${escapeHTML(eintrag.unicode)}<br>${escapeHTML(unicodeHex)}</span>
            </td>
            <td style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;">
              <span style="font-family:'Tekstvjór'">${escapeHTML(eintrag.transkriptionjamn)}</span>
            </td>
            <td style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;">
              <span style="font-family:'Tekstvjór'">${escapeHTML(eintrag.transkriptionlatein)}</span>
            </td>
            <td style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;">
              <span style="font-family:'Tekstvjór'">${escapeHTML(eintrag.ubersetzung)}</span>
            </td>
            <td style="padding:10px 12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;">
              <span style="font-family:'Tekstvjór'">${escapeHTML(eintrag.anmerkung)}</span>
            </td>
          `;
          tbody.appendChild(tr);
        }
        status.innerHTML =
          `<span style="font-family:'Tekstvjór'">${daten.length} Einträge</span>`;
        table.hidden = false;
      } catch (error) {
        console.error(error);
        status.innerHTML =
          `<span style="font-family:'Tekstvjór'">Die Daten konnten nicht geladen werden.</span>`;
      }
    }
    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
    ladeJarar();
  </script>
</div>
